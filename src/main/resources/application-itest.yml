spring:
  datasource:
    url: jdbc:h2:mem:orders-itest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: true
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      group-id: mcloud-orders-consumer-itest
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: ru.mentee.power.orders.ports.outgoing
        spring.json.value.default.type: ru.mentee.power.orders.ports.outgoing.OrderEventPayload
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    health-enabled: false
    topics:
      high: orders.priority.high
      normal: orders.priority.normal
      low: orders.priority.low
      dlq: orders.priority.dlq
  outbox:
    scheduler-enabled: false

pricing:
  base-url: http://localhost:8081
warehouse:
  base-url: http://localhost:8081
payments:
  base-url: http://localhost:8081