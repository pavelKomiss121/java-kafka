spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: orders
    password: orders
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: mcloud-orders-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: ru.mentee.power.orders.ports.outgoing
        spring.json.value.default.type: ru.mentee.power.orders.ports.outgoing.OrderEventPayload
        spring.json.use.type.headers: false
        max.poll.records: 5
        max.poll.interval.ms: 120000

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  kafka:
    health-enabled: true
    topics:
      high: orders.priority.high
      normal: orders.priority.normal
      low: orders.priority.low
      dlq: orders.priority.dlq

pricing:
  base-url: http://localhost:8081
